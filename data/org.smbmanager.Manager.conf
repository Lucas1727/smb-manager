<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own and implement the service. -->
  <policy user="root">
    <allow own="org.smbmanager.Manager"/>
    <allow send_destination="org.smbmanager.Manager"/>
  </policy>

  <!-- Any local user may call it; polkit does the real authorization. -->
  <policy context="default">
    <allow send_destination="org.smbmanager.Manager"
           send_interface="org.smbmanager.Manager"/>
    <allow send_destination="org.smbmanager.Manager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.smbmanager.Manager"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
